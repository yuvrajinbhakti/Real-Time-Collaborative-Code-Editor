services:
  - type: web
    name: realtime-code-editor
    runtime: node
    plan: starter
    region: oregon
    branch: master
    buildCommand: npm ci --legacy-peer-deps && npm run build:react
    startCommand: npm run start:ai
    healthCheckPath: /health
    autoDeploy: true
    env:
      # Pinned, not a floor. `engines.node: ">=18"` let Render resolve to the
      # newest Node (26), whose npm validates the lockfile against every
      # platform — and this lockfile only carries darwin-arm64 binaries for
      # sharp and msgpackr, so `npm ci` refused to install.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: info
      - key: SKIP_PREFLIGHT_CHECK
        value: "true"
      - key: CI
        value: "false"
      - key: GENERATE_SOURCEMAP
        value: "false"
      - key: INLINE_RUNTIME_CHUNK
        value: "false"
      - key: DISABLE_ESLINT_PLUGIN
        value: "true"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=2048"
      # AI Code Review Configuration (Optional)
      # Add these in Render Dashboard Environment Variables section:
      # GEMINI_API_KEY: your_gemini_api_key_here (FREE option)
      # OPENAI_API_KEY: your_openai_api_key_here (PAID option)  
      # AI_PROVIDER: gemini (or 'openai')
      # Redis (optional). Set REDIS_URL *or* REDIS_HOST to turn on document
      # persistence — rooms then survive a restart and remember who has used
      # them. With neither set, persistence stays off and everything else works
      # exactly the same; it is never attempted against a default localhost.
      # REDIS_URL: your_redis_url_here
      # REDIS_HOST: your_redis_host
      # REDIS_PORT: 6379
      # Performance Configuration
      - key: MAX_CONCURRENT_USERS
        value: "1000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
    buildFilter:
      paths:
        - src/**
        - public/**
        - package.json
        - package-lock.json
        - .node-version
        - server*.js
        - config/**
        - services/**
        - routes/**
        - middleware/**
        - models/**
        - build/**
      ignoredPaths:
        - "*.md"
        - "test*"
        - "debug*"
        - "fix*"
        - "Dockerfile*"
        - docker-compose*
        - logs/**
        - node_modules/**
        - .git/** 